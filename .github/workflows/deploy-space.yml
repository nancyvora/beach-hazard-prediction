name: Upload code to Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-hugging-face-space
  cancel-in-progress: false

jobs:
  upload:
    # This uploads source only. Model/history publication is a separate step.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - name: Check deployment configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          python - <<'PY'
          import os
          for name in ("HF_TOKEN", "HF_SPACE_REPO"):
              if not os.environ.get(name):
                  raise SystemExit(f"Configure {name} in repository Actions secrets/variables first")
          PY
      - run: python -m pip install -r requirements-deploy.txt
      - name: Preview upload package
        run: python -m deploy.push_space --dry-run
      - name: Upload app source to existing Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m deploy.push_space
